name: Build Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependencies
        run: npm install
        
      - name: Build EXE
        run: npm run dist
        
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: InstantWebSite-exe
          path: dist-exe/**/*.exe
